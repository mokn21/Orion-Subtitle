name: OrionSubtitles
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Release builds override these from the git tag (scripts/package-ipa.sh)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OrionSubtitles:
    type: application
    platform: iOS
    sources:
      - App
      - App/Views/TranslationModesView.swift
    dependencies:
      - framework: Frameworks/ChiakiKit.xcframework
        embed: false
    # Signing team and bundle ID live in Config/Local.xcconfig (see Config/Signing.xcconfig)
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORION_BUNDLE_ID)
        ORION_TRANSLATION_PROXY_URL: ""
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MTL_FAST_MATH: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orion Subtitles
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TRANSLATION_PROXY_URL: $(ORION_TRANSLATION_PROXY_URL)
        UIDeviceFamily:
          - 2
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        # Lets ProMotion run above 60 Hz
        NSLocalNetworkUsageDescription: Orion Subtitles finds and connects to your PS5 on the local network for Remote Play.
        # Game controllers can drive the UI and Game Mode kicks in while streaming
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: DualSense
  OrionSubtitlesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: OrionSubtitles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orion.subtitles.tests
