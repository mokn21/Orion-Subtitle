# Push a tag like v0.2.0 to build an unsigned IPA, attach it to a GitHub
# release and add it to the SideStore/AltStore source.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew install cmake ninja xcodegen
          # Newer Xcodes ship the Metal compiler as a separate download
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Build IPA
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${{ github.run_number }}" scripts/package-ipa.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Orion-Subtitles.ipa --title "Orion Subtitles $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" build/Orion-Subtitles.ipa --clobber

      - name: Update sideload source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          scripts/update-source.sh "${GITHUB_REF_NAME#v}" build/Orion-Subtitles.ipa \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Orion-Subtitles.ipa"
          git add altstore-source.json
          git commit -m "chore: add ${GITHUB_REF_NAME} to sideload source"
          git push origin main
