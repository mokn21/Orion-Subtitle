name: Build Orion Subtitles TV

on:
  workflow_dispatch:
  push:
    branches:
      - orion-rebuild
    paths:
      - "AndroidTV/**"
      - "Shared/**"
      - ".github/workflows/build-orion-tv.yml"

permissions:
  contents: write

jobs:
  build:
    name: Test, build, and publish Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          # The iPad's vendored Chiaki/Oboe source includes its own wrapper JAR.
          # The Android TV build does not execute those unrelated wrappers.
          validate-wrappers: false

      - name: Run unit tests and assemble TV APK
        run: |
          set -euo pipefail
          gradle -p AndroidTV --no-daemon clean testDebugUnitTest assembleDebug
          test -s AndroidTV/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-subtitles-tv-debug-apk
          path: AndroidTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tv-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" AndroidTV/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Orion Subtitles TV ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android TV debug build from commit ${GITHUB_SHA}. The APK is for testing; HDMI overlay behavior must be verified on the target TV."
